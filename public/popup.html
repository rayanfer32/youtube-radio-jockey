<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube RJ // Komplete Broadcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      html, body {
        width: 520px;
        height: 590px;
        max-height: 590px;
        margin: 0;
        padding: 0;
        background-color: #08090b;
        color: #f1f5f9;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      #root {
        width: 520px;
        height: 590px;
        max-height: 590px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Custom NI Hardware Texture & Knobs */
      .ni-metal-bevel {
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.7);
      }
      .ni-recessed {
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.85), 0 1px 0 rgba(255,255,255,0.04);
      }
      .knob-radial-shadow {
        box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.9);
      }
      .glow-cyan {
        box-shadow: 0 0 12px rgba(0, 210, 196, 0.45);
      }
      .glow-cyan-subtle {
        box-shadow: 0 0 6px rgba(0, 210, 196, 0.25);
      }
      .glow-amber {
        box-shadow: 0 0 12px rgba(255, 158, 27, 0.45);
      }
      /* High-Visibility Hardware Rack Scrollbar Rail */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #08090B;
        border-left: 2px solid #282C37;
        box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9);
      }
      ::-webkit-scrollbar-thumb {
        background: #00D2C4;
        border: 2px solid #08090B;
        border-radius: 6px;
        box-shadow: 0 0 8px rgba(0, 210, 196, 0.85);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38FDF1;
        box-shadow: 0 0 14px rgba(0, 210, 196, 1);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #00D2C4 #08090B;
      }
      .rack-scrollbar {
        overflow-y: scroll !important;
        scrollbar-gutter: stable;
      }
      .rack-scrollbar::-webkit-scrollbar {
        width: 10px !important;
        display: block !important;
      }
      .rack-scrollbar::-webkit-scrollbar-track {
        background: #08090B !important;
        border-left: 2px solid #282C37 !important;
        box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.9) !important;
      }
      .rack-scrollbar::-webkit-scrollbar-thumb {
        background: #00D2C4 !important;
        border: 2px solid #08090B !important;
        border-radius: 6px !important;
        box-shadow: 0 0 8px rgba(0, 210, 196, 0.85) !important;
      }
      .rack-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #38FDF1 !important;
        box-shadow: 0 0 14px rgba(0, 210, 196, 1) !important;
      }
    </style>
  </head>
  <body class="bg-[#08090B]">
    <div id="root"></div>
    <script src="./lib/twind.js"></script>
    <script type="module" src="./popup.js" defer></script>
  </body>
</html>
